<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Tilth - clean drops, cleaner city</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Structural styles shared by the portal and the console. Colours come from
 * each app's own tokens. */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p {
  margin: 0;
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
a {
  color: inherit;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
[hidden] {
  display: none !important;
}

#toasts {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(380px, calc(100vw - 32px));
}
.toast {
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--toast-bg);
  color: var(--toast-ink);
  border-left: 5px solid var(--toast-edge);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  animation: toast-in 0.25s ease-out both;
}
.toast-good { border-left-color: var(--good); }
.toast-bad { border-left-color: var(--bad); }
.toast-warn { border-left-color: var(--warn); }
.toast.out {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.4s, transform 0.4s;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
  <style>
:root {
  --paper: #eef3ef;
  --surface: #ffffff;
  --ink: #10261d;
  --ink-2: #3d554a;
  --line: #d3ddd7;
  --leaf: #15915f;
  --leaf-deep: #0c6b44;
  --leaf-tint: #ddf1e7;
  --good: #15915f;
  --warn: #d68a0c;
  --warn-tint: #fbefd2;
  --warn-ink: #7a4c00;
  --bad: #c93434;
  --bad-tint: #f8dedc;
  --bad-ink: #8c1f1f;
  --info: #137ea6;
  --info-tint: #d9eef6;
  --focus: #137ea6;
  --toast-bg: #10261d;
  --toast-ink: #ffffff;
  --toast-edge: #137ea6;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --band-1: #cfe3d8;
  --band-2: #a7d3bc;
  --band-3: #6fbb98;
  --band-4: #2fa070;
  --band-5: #0c6b44;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------- shell ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 clamp(16px, 4vw, 40px);
  height: 64px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.wordmark {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.03em;
  color: var(--leaf-deep);
  text-decoration: none;
}
.nav {
  display: flex;
  gap: 4px;
  flex: 1;
}
.nav a {
  position: relative;
  padding: 20px 12px 18px;
  font-weight: 500;
  text-decoration: none;
  color: var(--ink-2);
}
.nav a[aria-current='page'] {
  color: var(--ink);
}
.nav a[aria-current='page']::after {
  content: '';
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 0;
  height: 3px;
  background: var(--leaf);
  border-radius: 3px 3px 0 0;
}
.badge-count {
  display: inline-block;
  min-width: 20px;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--bad);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}
.userbox {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line);
}
.live-dot.on {
  background: var(--good);
}

main#view {
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px clamp(16px, 4vw, 40px) 80px;
}

@media (max-width: 720px) {
  .topbar {
    gap: 12px;
  }
  .nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    justify-content: space-around;
    padding-bottom: var(--safe-bottom);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .nav a {
    padding: 14px 8px;
    font-size: 13px;
  }
  .nav a[aria-current='page']::after {
    top: 0;
    bottom: auto;
    border-radius: 0 0 3px 3px;
  }
  .userbox .who {
    display: none;
  }
  .topbar {
    justify-content: space-between;
  }
}

/* ---------- primitives ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
}
.card > h2,
.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
}
.muted {
  color: var(--ink-2);
}
.small {
  font-size: 13px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.c4 { grid-column: span 4; }
.c5 { grid-column: span 5; }
.c6 { grid-column: span 6; }
.c7 { grid-column: span 7; }
.c12 { grid-column: span 12; }
@media (max-width: 900px) {
  .c4, .c5, .c6, .c7 { grid-column: span 12; }
}
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-weight: 600;
  background: var(--leaf);
  color: #fff;
}
.btn:hover:not(:disabled) { background: var(--leaf-deep); }
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn.ghost:hover:not(:disabled) { background: var(--paper); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: var(--bad); }

.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--paper);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.good { background: var(--leaf-tint); color: var(--leaf-deep); }
.chip.warn { background: var(--warn-tint); color: var(--warn-ink); }
.chip.bad { background: var(--bad-tint); color: var(--bad-ink); }
.chip.info { background: var(--info-tint); color: #0b5872; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 600; font-size: 14px; }
.field input,
.field textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid #a9b9b0;
  border-radius: 10px;
  background: #fff;
}
.field input:focus,
.field textarea:focus { border-color: var(--focus); }
.field .hint { font-size: 13px; color: var(--ink-2); }
.error { color: var(--bad-ink); font-weight: 500; min-height: 1.4em; }

.bar {
  height: 10px;
  border-radius: 999px;
  background: var(--paper);
  overflow: hidden;
  border: 1px solid var(--line);
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--leaf);
  border-radius: 999px;
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar.amber > i { background: var(--warn); }

.empty {
  padding: 28px 12px;
  text-align: center;
  color: var(--ink-2);
}

/* ---------- sign-in ---------- */

.auth {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
}
.auth-art {
  padding: clamp(28px, 6vw, 72px);
  background: var(--leaf-deep);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 40px;
}
.auth-art .wordmark { color: #fff; }
.auth-art h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(38px, 6vw, 72px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  max-width: 11ch;
}
.auth-art p { max-width: 38ch; font-size: 17px; }
.auth-steps { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; counter-reset: s; }
.auth-steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; }
.auth-steps li::before {
  content: counter(s);
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid #fff;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
  line-height: 22px;
}
.auth-form {
  display: grid;
  place-content: center;
  padding: 32px clamp(20px, 6vw, 72px);
}
.auth-form form { width: min(380px, 100%); }
.tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.tabs button {
  padding: 10px 14px;
  border: 0;
  background: none;
  font-weight: 600;
  color: var(--ink-2);
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
}
.tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--leaf); }
@media (max-width: 860px) {
  .auth { grid-template-columns: 1fr; }
  .auth-art { gap: 24px; }
}

/* ---------- home ---------- */

.hero-line {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(26px, 4vw, 38px);
  letter-spacing: -0.025em;
  line-height: 1.1;
  margin-bottom: 20px;
}

.dial-wrap { position: relative; max-width: 300px; margin: 0 auto; }
.dial { width: 100%; height: auto; display: block; }
.dial .track { fill: none; stroke-width: 16; stroke-linecap: butt; }
.dial .prog { fill: none; stroke-width: 16; stroke-linecap: butt; stroke-dasharray: 1 1; }
.dial .knob { transition: transform 1.1s cubic-bezier(0.25, 0.8, 0.25, 1); }
.dial-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  padding-bottom: 18px;
}
.dial-score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 68px;
  line-height: 1;
  letter-spacing: -0.04em;
}
.dial-tier { font-weight: 600; margin-top: 6px; color: var(--leaf-deep); }
.dial-label { font-size: 13px; color: var(--ink-2); }
.credits-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 1px solid var(--line);
  margin-top: 8px;
  padding-top: 14px;
}
.credits-row b {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.level-line { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.level-line b { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.pips { display: flex; gap: 6px; margin: 8px 0 4px; }
.pip { width: 100%; max-width: 38px; height: 10px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); }
.pip.on { background: var(--warn); border-color: var(--warn); }

.quest { padding: 12px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest .row { margin-bottom: 8px; }
.quest b { flex: 1; }

.impact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { padding: 4px 0; }
.tile .big {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(30px, 4vw, 44px);
  line-height: 1;
  letter-spacing: -0.03em;
}
.tile .unit { font-size: 16px; font-weight: 600; margin-left: 4px; color: var(--ink-2); }
.tile .lbl { margin-top: 6px; font-weight: 600; }
@media (max-width: 720px) { .impact { grid-template-columns: repeat(2, 1fr); } }

.alertbox {
  border: 1px solid #e3aaa5;
  background: var(--bad-tint);
  color: var(--bad-ink);
  border-radius: 16px;
  padding: 18px 22px;
  margin-bottom: 16px;
}
.alertbox h2 { font-family: var(--font-display); font-size: 20px; margin-bottom: 6px; }
.alertbox .pen { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid #e3aaa5; margin-top: 10px; flex-wrap: wrap; }
.alertbox.review { background: var(--warn-tint); border-color: #e2c274; color: var(--warn-ink); }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 8px; }
.badge { text-align: center; font-size: 13px; font-weight: 600; line-height: 1.25; }
.badge svg { width: 68px; height: 68px; display: block; margin: 0 auto 6px; }
.badge.locked { color: var(--ink-2); font-weight: 500; }
.hex-fill { fill: var(--leaf); }
.hex-ring { fill: none; stroke: #fff; stroke-width: 2; opacity: 0.55; }
.hex-text { fill: #fff; font-family: var(--font-display); font-weight: 800; font-size: 21px; text-anchor: middle; }
.badge.locked .hex-fill { fill: none; stroke: #9db1a7; stroke-width: 2; stroke-dasharray: 4 4; }
.badge.locked .hex-ring { display: none; }
.badge.locked .hex-text { fill: #7a9186; }

/* ---------- lists ---------- */

.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 14px 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.dep { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 0; }
.dep .meta { color: var(--ink-2); font-size: 13.5px; }
.dep .nums { text-align: right; font-weight: 600; }
.dep-detail { margin-top: 10px; padding: 12px 14px; background: var(--paper); border-radius: 10px; font-size: 14px; }
.dep-detail ul { margin: 6px 0 0; padding-left: 18px; }
.reason { display: flex; gap: 10px; margin-top: 6px; }

.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 13px; color: var(--ink-2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table td { padding: 12px 10px; border-bottom: 1px solid var(--line); }
.table tr.me td { background: var(--leaf-tint); font-weight: 600; }
.rank { font-family: var(--font-display); font-weight: 800; font-size: 20px; width: 44px; }

.steps { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.steps li::before {
  content: counter(st);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--leaf-tint);
  color: var(--leaf-deep);
  font-weight: 700;
  display: grid;
  place-content: center;
}

.note { padding: 12px 14px; border-radius: 10px; background: var(--info-tint); color: #0b5872; font-size: 14px; }

/* ---------- result sheet ---------- */

dialog#sheet {
  width: min(520px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  padding: 0;
  border: 0;
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink);
  overflow: auto;
}
dialog#sheet::backdrop { background: rgba(9, 28, 20, 0.6); }
.sheet-head { padding: 28px 28px 8px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05; margin-top: 8px; }
.sheet-body { padding: 8px 28px 28px; }
.sheet-tone-good .sheet-head { background: var(--leaf-tint); }
.sheet-tone-warn .sheet-head { background: var(--warn-tint); }
.sheet-tone-bad .sheet-head { background: var(--bad-tint); }
.result-grid { display: grid; grid-template-columns: 130px 1fr; gap: 20px; align-items: center; margin: 16px 0; }
.ring { width: 130px; height: 130px; }
.ring .bg { fill: none; stroke: var(--paper); stroke-width: 12; }
.ring .fg { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s cubic-bezier(0.2, 0.8, 0.2, 1); transform: rotate(-90deg); transform-origin: 60px 60px; }
.ring text { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-anchor: middle; fill: var(--ink); }
.stat-list { display: grid; gap: 8px; margin: 0; }
.stat-list div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.stat-list dt { color: var(--ink-2); }
.stat-list dd { margin: 0; font-weight: 700; }
.earned { margin-top: 14px; display: grid; gap: 8px; }
.earned div { padding: 10px 14px; border-radius: 10px; background: var(--leaf-tint); color: var(--leaf-deep); font-weight: 600; }
.penalty-box { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--bad-tint); color: var(--bad-ink); }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
@media (max-width: 480px) { .result-grid { grid-template-columns: 1fr; justify-items: center; } }

/* ---------- additions ---------- */

.mt { margin-top: 12px; }
.big-num { font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.tier-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
.tier-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tier-legend span.on { color: var(--ink); font-weight: 700; }
.tier-legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw1 { background: var(--band-1); } .sw2 { background: var(--band-2); } .sw3 { background: var(--band-3); }
.sw4 { background: var(--band-4); } .sw5 { background: var(--band-5); }
.field input[type='checkbox'] { width: auto; }
.row.small label { cursor: pointer; }

</style>
</head>

  <script>
/* Shared helpers for the resident portal and the staff console.
 * No framework: a tiny DOM builder, fetch wrapper and SSE wrapper.
 * All text is inserted with textContent, never innerHTML, so API data
 * cannot inject markup. */
(function (global) {
  'use strict';

  const T = {};

  /* ---------- DOM ---------- */

  const PROP_KEYS = new Set(['value', 'checked', 'disabled', 'selected', 'type', 'href', 'min', 'max', 'step', 'placeholder', 'required', 'autocomplete', 'rows', 'maxLength', 'minLength', 'name', 'id', 'title', 'open', 'hidden']);

  // Element.append() turns null/false into the text "null"/"false". Every element
  // built here gets a null-safe append so conditional children can be written inline.
  const nativeAppend = Element.prototype.append;

  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) kid.forEach((k) => append(el, k));
    else nativeAppend.call(el, kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

  function safe(el) {
    el.append = (...kids) => kids.forEach((k) => append(el, k));
    return el;
  }

  T.h = function h(tag, props, ...kids) {
    const el = safe(document.createElement(tag));
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'text') el.textContent = v;
      else if (PROP_KEYS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.forEach((kid) => append(el, kid));
    return el;
  };

  function dial(p) {

    const pt = (a) => [cx + r * Math.cos((a * Math.PI) / 180), cy + r * Math.sin((a * Math.PI) / 180)];

      if (!items.length) {
        lastBody.className = 'empty';
        lastBody.append('No deposits yet. Tap your bin to a docking station to start.');
        return;
      }
      const dep = items[0];
      lastBody.append(
        h('div', { class: 'row between' }, outcomeChip(dep.outcome), h('span', { class: 'muted small' }, `${dep.dockId} · ${fmt.ago(dep.at)}`)),
        h('div', { class: 'row wrap mt' }, h('b', { class: 'big-num' }, `${(dep.purity * 100).toFixed(1)}%`), h('span', { class: 'muted' }, `purity · ${fmt.num(dep.verifiedKg, 2)} kg verified`)),
        h('p', {}, `${fmt.signed(dep.credits)} credits, score ${fmt.signed(dep.scoreDelta)}`),
        ...dep.flags.filter((f) => FLAG_TEXT[f]).slice(0, 2).map((f) => h('p', { class: 'small muted mt' }, FLAG_TEXT[f])),
        h('a', { href: '#/deposits', class: 'small' }, 'See all deposits')
      );
    }).catch(() => {});

    /* badges */
    const earned = p.badges.filter((b) => b.earned).length;
    const badgeCard = h('section', { class: 'card c7', 'aria-label': 'Badges' },
      h('div', { class: 'row between' }, h('h2', {}, 'Badges'), h('span', { class: 'muted small' }, `${earned} of ${p.badges.length} earned`)),
      h('div', { class: 'badges' }, ...p.badges.map(hexBadge))
    );

    root.append(h('div', { class: 'grid' }, scoreCard, progressCard, impactCard, lastCard, badgeCard));

    root.afterMount = () => {
      d.play();
      countUp(scoreEl, p.creditScore, 1100);
      countUp($('creditsNum'), p.credits, 900);
      requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll('.bar > i').forEach((el) => { el.style.width = el.dataset.w; })));
    };
    return root;
  }

  /* ---------- deposit result sheet ---------- */

  function showResult(r) {
    const o = OUTCOME[r.outcome];
    const heads = { ACCEPTED: 'Clean drop.', PARTIAL: 'Accepted, with a note.', REJECTED: 'This one was rejected.', FLAGGED: 'Held for review.', INVALID: "We couldn't verify this batch." };
    const tone = o.tone === 'neutral' ? '' : o.tone;
    const color = tone === 'good' ? 'var(--good)' : tone === 'warn' ? 'var(--warn)' : tone === 'bad' ? 'var(--bad)' : 'var(--info)';

    const fg = svg('circle', { class: 'fg', cx: 60, cy: 60, r: 54, pathLength: 1, stroke: color });
    fg.style.strokeDashoffset = T.reducedMotion ? 1 - r.purity : 1;
    const credits = h('dd', {}, T.reducedMotion ? fmt.signed(r.credits) : '+0');

    const stats = h('dl', { class: 'stat-list' },
      h('div', {}, h('dt', {}, 'Verified'), h('dd', {}, `${fmt.num(r.verifiedKg, 2)} kg`)),
      h('div', {}, h('dt', {}, 'Credits'), credits),
      h('div', {}, h('dt', {}, 'Credit score'), h('dd', {}, `${r.scoreAfter} (${fmt.signed(r.scoreDelta)})`)),
      h('div', {}, h('dt', {}, 'XP'), h('dd', {}, `+${r.xpGained}`)));

    const reasons = r.flags.filter((f) => FLAG_TEXT[f]);
    const body = h('div', { class: 'sheet-body' },
      h('div', { class: 'result-grid' },
        svg('svg', { viewBox: '0 0 120 120', class: 'ring', role: 'img', 'aria-label': `Purity ${(r.purity * 100).toFixed(1)} percent` }, svg('circle', { class: 'bg', cx: 60, cy: 60, r: 54 }), fg, svg('text', { x: 60, y: 69 }, `${(r.purity * 100).toFixed(0)}%`)),
        stats),
      reasons.length ? h('ul', { class: 'small mt' }, ...reasons.map((f) => h('li', {}, FLAG_TEXT[f]))) : h('p', { class: 'muted small mt' }, r.summary),
      r.penalty ? h('div', { class: 'penalty-box' }, h('b', {}, `Strike ${r.penalty.strike}: ${r.penalty.type.toLowerCase()}`), h('div', { class: 'small' }, r.penalty.suspendedUntil ? `Pairing is paused until ${fmt.date(r.penalty.suspendedUntil)}.` : r.penalty.creditsDeducted ? `${r.penalty.creditsDeducted} credits were deducted.` : 'This is a warning; your score dropped.'), h('div', { class: 'small' }, 'You can appeal from the Deposits page.')) : null,
      r.badges.length || r.quests.length || r.levelUp
        ? h('div', { class: 'earned' },
            r.levelUp ? h('div', {}, `Level ${r.level} reached`) : null,
            ...r.badges.map((b) => h('div', {}, `Badge earned: ${b.name}`)),
            ...r.quests.map((q) => h('div', {}, `Quest complete: ${q.title} (+${q.reward})`)))
        : null,
      h('div', { class: 'sheet-actions' },
        r.penalty ? h('a', { class: 'btn ghost', href: '#/deposits', on: { click: closeSheet } }, 'View penalty') : null,
        h('button', { class: 'btn', type: 'button', on: { click: closeSheet } }, r.outcome === 'ACCEPTED' || r.outcome === 'PARTIAL' ? 'Keep going' : 'Got it'))
    );

    openSheet(h('div', {}, h('div', { class: 'sheet-head' }, outcomeChip(r.outcome), h('h2', {}, heads[r.outcome]), h('p', { class: 'muted small mt' }, `${r.dockId} · ${fmt.time(r.at)}`)), body), tone);

    if (!T.reducedMotion) {
      requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = 1 - r.purity; }));
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / 900);
        credits.textContent = fmt.signed(Math.round(r.credits * (1 - (1 - t) ** 3)));
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  }

  function appealSheet(pen) {
    const note = h('textarea', { rows: 4, maxLength: 500, placeholder: 'What happened? Staff will read this.' });
    const err = h('div', { class: 'error', role: 'alert' });
    const send = h('button', { class: 'btn', type: 'button' }, 'Send appeal');
    send.addEventListener('click', async () => {
      err.textContent = '';
      send.disabled = true;
      try {
        await api(`/api/me/penalties/${pen.id}/appeal`, { method: 'POST', body: { note: note.value } });
        closeSheet();
        toast('Appeal sent. Staff will review it.', 'good');
        refreshProfile();
        if (state.route === 'deposits') route();
      } catch (e) {
        err.textContent = e.message;
        send.disabled = false;
      }
    });
    openSheet(h('div', {}, h('div', { class: 'sheet-head' }, h('h2', {}, 'Appeal this penalty'), h('p', { class: 'muted small mt' }, pen.reason)),
      h('div', { class: 'sheet-body' }, field('Your explanation', note, 'Five characters minimum. If staff waive the penalty, your credits and score are restored.'), err,
        h('div', { class: 'sheet-actions' }, h('button', { class: 'btn ghost', type: 'button', on: { click: closeSheet } }, 'Cancel'), send))));
  }

  /* ---------- deposits ---------- */

  async function depositsView() {
    const root = h('div', { class: 'stack' });
    const [{ items: pens }] = await Promise.all([api('/api/me/penalties')]);
    if (pens.length) {
      root.append(
        h('section', { class: 'card' }, h('h2', {}, 'Penalties'),
          h('ul', { class: 'list' }, ...pens.map((p) => {
            const canAppeal = p.status === 'ACTIVE' && Date.now() - new Date(p.createdAt).getTime() < 14 * 864e5;
            const tone = { ACTIVE: 'bad', APPEALED: 'warn', WAIVED: 'good', UPHELD: '' }[p.status];
            return h('li', {},
              h('div', { class: 'row between wrap' }, h('b', {}, `Strike ${p.strike}: ${p.type.toLowerCase()}`), chip(p.status.toLowerCase(), tone)),
              h('p', { class: 'small mt' }, p.reason),
              h('p', { class: 'small muted mt' }, `${fmt.date(p.createdAt)} · ${p.creditsDeducted} credits, ${p.scoreApplied} score${p.suspendedUntil ? ` · pairing paused until ${fmt.date(p.suspendedUntil)}` : ''}`),
              p.appealNote ? h('p', { class: 'small mt' }, `Your appeal: ${p.appealNote}`) : null,
              p.resolutionNote ? h('p', { class: 'small mt' }, `Staff note: ${p.resolutionNote}`) : null,
              canAppeal ? h('button', { class: 'btn small ghost', type: 'button', on: { click: () => appealSheet(p) } }, 'Appeal') : null);
          })))
      );
    }

    const list = h('ul', { class: 'list' });
    const more = h('button', { class: 'btn ghost', type: 'button' }, 'Load more');
    let before = null;
    async function load() {
      more.disabled = true;
      const { items, hasMore } = await api(`/api/me/deposits?limit=15${before ? `&before=${encodeURIComponent(before)}` : ''}`);
      for (const d of items) list.append(depositRow(d));
      if (items.length) before = items[items.length - 1].at;
      more.hidden = !hasMore;
      more.disabled = false;
      if (!list.children.length) list.append(h('li', { class: 'empty' }, 'No deposits yet.'));
    }
    more.addEventListener('click', load);
    root.append(h('section', { class: 'card' }, h('h2', {}, 'Deposit history'), list, h('div', { class: 'row mt' }, more)));
    await load();
    return root;
  }

  function depositRow(d) {
    const detail = h('div', { class: 'dep-detail', hidden: true },
      h('div', {}, d.summary),
      d.flags.filter((f) => FLAG_TEXT[f]).length ? h('ul', {}, ...d.flags.filter((f) => FLAG_TEXT[f]).map((f) => h('li', {}, FLAG_TEXT[f]))) : null,
      h('div', { class: 'small muted mt' }, `Accuracy ${d.accuracy}/100 · Bin ${d.binId}`));
    const btn = h('button', { class: 'dep', type: 'button', 'aria-expanded': 'false', on: { click: () => { detail.hidden = !detail.hidden; btn.setAttribute('aria-expanded', String(!detail.hidden)); } } },
      h('div', {}, h('div', { class: 'row' }, outcomeChip(d.outcome), h('b', {}, `${(d.purity * 100).toFixed(1)}% purity`)), h('div', { class: 'meta' }, `${fmt.date(d.at)} · ${d.dockId}`)),
      h('div', { class: 'nums' }, h('div', {}, `${fmt.num(d.verifiedKg, 2)} kg`), h('div', { class: 'small muted' }, `${fmt.signed(d.credits)} credits`)));
    return h('li', {}, btn, detail);
  }

  /* ---------- bins ---------- */

  async function binsView() {
    const p = (state.profile = await api('/api/me'));
    const { items: sessions } = await api('/api/me/sessions');
    const root = h('div', { class: 'grid' });

    const binList = p.bins.length
      ? h('ul', { class: 'list' }, ...p.bins.map((b) => h('li', {}, h('div', { class: 'row between wrap' }, h('b', {}, b.binId), chip(b.status.toLowerCase(), b.status === 'ACTIVE' ? 'good' : 'bad')), h('div', { class: 'small muted' }, b.lastPairedAt ? `Last paired ${fmt.ago(b.lastPairedAt)} at ${b.lastDockId}` : `Linked ${fmt.day(b.claimedAt)}, not paired yet`))))
      : h('div', { class: 'empty' }, 'No bins linked yet.');

    const binId = h('input', { type: 'text', placeholder: 'BIN-1A2B3C', autocomplete: 'off', maxLength: 10 });
    const code = h('input', { type: 'text', placeholder: 'ABCD-EFGH-JKMN', autocomplete: 'off', maxLength: 14 });
    const err = h('div', { class: 'error', role: 'alert' });
    const go = h('button', { class: 'btn', type: 'button' }, 'Link bin');
    go.addEventListener('click', async () => {
      err.textContent = '';
      go.disabled = true;
      try {
        await api('/api/me/bins/claim', { method: 'POST', body: { binId: binId.value.trim().toUpperCase(), claimCode: code.value } });
        toast('Bin linked to your account.', 'good');
        await refreshProfile();
      } catch (e) {
        err.textContent = e.message;
        go.disabled = false;
      }
    });

    const sessionTone = { PAIRED: 'good', CLOSED: 'good', CHALLENGED: 'info', EXPIRED: '', FAILED: 'bad' };
    root.append(
      h('section', { class: 'card c6' }, h('h2', {}, 'My bins'), binList),
      h('section', { class: 'card c6' }, h('h2', {}, 'Link a bin'), h('p', { class: 'muted small mt' }, 'The bin ID and claim code are printed on the label inside the lid.'), field('Bin ID', binId), field('Claim code', code), err, go),
      h('section', { class: 'card c6' }, h('h2', {}, 'How pairing works'),
        h('ol', { class: 'steps' },
          h('li', {}, h('div', {}, h('b', {}, 'Tap'), h('div', { class: 'small muted' }, 'Hold the bin to the dock NFC pad. The dock reads the tag ID.'))),
          h('li', {}, h('div', {}, h('b', {}, 'Handshake'), h('div', { class: 'small muted' }, 'Over Bluetooth the bin proves it holds its secret key. The key never leaves the bin.'))),
          h('li', {}, h('div', {}, h('b', {}, 'Deposit'), h('div', { class: 'small muted' }, 'The hatch opens for 10 minutes. The dock weighs and scans your batch, then credits you.')))),
        h('p', { class: 'note mt' }, 'Lost or sold a bin? Ask staff to unlink it so nobody else can use it.')),
      h('section', { class: 'card c6' }, h('h2', {}, 'Recent pairing attempts'),
        sessions.length ? h('ul', { class: 'list' }, ...sessions.slice(0, 8).map((s) => h('li', {}, h('div', { class: 'row between wrap' }, h('span', {}, `${s.dockId} · ${s.binId}`), chip(s.state.toLowerCase(), sessionTone[s.state])), h('div', { class: 'small muted' }, `${fmt.date(s.at)}${s.failReason ? ` · ${s.failReason.toLowerCase().replace(/_/g, ' ')}` : ''}`)))) : h('div', { class: 'empty' }, 'Nothing yet.'))
    );
    return root;
  }

  /* ---------- leaderboard ---------- */

  async function boardView() {
    const [lb] = await Promise.all([api('/api/leaderboard')]);
    const p = state.profile || (state.profile = await api('/api/me'));
    const row = (r) => h('tr', { class: r.isMe ? 'me' : '' }, h('td', { class: 'rank' }, r.rank), h('td', {}, r.name, r.isMe ? ' (you)' : ''), h('td', {}, r.tier), h('td', {}, `${fmt.num(r.kg, 1)} kg`), h('td', {}, r.deposits));
    const rows = lb.top.map(row);
    if (lb.me && !lb.top.some((r) => r.isMe)) rows.push(h('tr', {}, h('td', { colspan: 5, class: 'muted small' }, '...')), row(lb.me));

    const toggle = h('input', { type: 'checkbox', checked: p.showOnLeaderboard, id: 'lbToggle' });
    toggle.addEventListener('change', async () => {
      try {
        await api('/api/me', { method: 'PATCH', body: { showOnLeaderboard: toggle.checked } });
        state.profile.showOnLeaderboard = toggle.checked;
        toast(toggle.checked ? 'You are visible on the leaderboard.' : 'You are hidden from others.', 'neutral');
      } catch (e) {
        toggle.checked = !toggle.checked;
        toast(e.message, 'bad');
      }
    });

    return h('section', { class: 'card' },
      h('div', { class: 'row between wrap' }, h('h2', {}, `Leaderboard, ${lb.month}`), h('label', { class: 'row small', for: 'lbToggle' }, toggle, 'Show me on the leaderboard')),
      h('p', { class: 'muted small mt' }, 'Ranked by verified kilograms this month. Only display names are shown.'),
      lb.top.length ? h('table', { class: 'table' }, h('thead', {}, h('tr', {}, h('th', {}, '#'), h('th', {}, 'Name'), h('th', {}, 'Tier'), h('th', {}, 'Verified'), h('th', {}, 'Deposits'))), h('tbody', {}, rows)) : h('div', { class: 'empty' }, 'No verified deposits yet this month. Be the first.'));
  }

  /* ---------- alerts ---------- */

  async function alertsView() {
    const { items } = await api('/api/me/notifications');
    if (state.unread) {
      api('/api/me/notifications/read', { method: 'POST' }).then(() => {
        state.unread = 0;
        updateHeader();
      }).catch(() => {});
    }
    const tone = { good: 'good', bad: 'bad', info: 'info' };
    return h('section', { class: 'card' }, h('h2', {}, 'Alerts'),
      items.length ? h('ul', { class: 'list' }, ...items.map((n) => h('li', {}, h('div', { class: 'row between wrap' }, h('b', {}, n.title), chip(fmt.ago(n.at), tone[n.tone])), n.body ? h('p', { class: 'small muted mt' }, n.body) : null))) : h('div', { class: 'empty' }, 'Nothing here yet.'));
  }

  const VIEWS = { home: homeView, deposits: depositsView, bins: binsView, board: boardView, alerts: alertsView };

  /* ---------- boot ---------- */

  async function boot() {
    T.onUnauthorized = () => showAuth();
    try {
      state.profile = await api('/api/me');
    } catch {
      return showAuth();
    }
    return showShell();
  }

  boot();
})();

</script>
</body>
</html>
